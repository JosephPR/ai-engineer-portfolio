<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#f6a723"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <clipPath id="disc">
      <circle cx="32" cy="33" r="21"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#09090b"/>
  <!-- A sun cut by horizon lines that thin out towards the bottom -->
  <g clip-path="url(#disc)" fill="url(#dawn)">
    <rect x="0" y="10" width="64" height="27"/>
    <rect x="0" y="40.5" width="64" height="5"/>
    <rect x="0" y="48.5" width="64" height="3"/>
    <rect x="0" y="54" width="64" height="1.5"/>
  </g>
</svg>
